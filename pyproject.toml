[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smoothvi"
version = "0.1.0"
description = "Structure-preserving approximations for variational inference"
requires-python = ">=3.9.13"

dependencies = [
    "numpy",
    "scipy",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]